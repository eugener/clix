# Version updates are disabled (open-pull-requests-limit: 0).
# Security updates are bundled into one grouped PR per ecosystem.
version: 2
updates:
- package-ecosystem: gomod
  directories:
  - /
  - /examples/advanced
  - /examples/config
  - /examples/fluent-api
  - /examples/interactive
  - /examples/simple
  schedule:
    interval: weekly
  open-pull-requests-limit: 0
  groups:
    gomod-security:
      applies-to: security-updates
      patterns:
      - '*'
